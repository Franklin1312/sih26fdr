[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26psfdr"
version = "0.1.0"
description = "SIH26265 Security Deposit / FDR Management Portal"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "black==24.8.0",
    "mypy==1.11.0",
]

[project.scripts]
seed-demo = "scripts.seed_demo:main"
verify-audit = "scripts.verify_audit:main"
run-alerts = "scripts.run_alerts:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
  - "management"
  - "polytechnic"
  - "architecture"
  - "pharmacy"
  - "hotel_management"
  - "applied_arts"
  - "government"
  - "government_aided"
  - "private_unaided"
  - "university"
  - "deemed_university"

# -----------------------------------------------------------------------------
# ROLE PERMISSIONS (reference)
# -----------------------------------------------------------------------------
role_permissions:
  INSTITUTION_REP:
    - "case:create"
    - "case:read_own"
    - "case:update_draft"
    - "document:upload"
    - "document:read_own"
    - "clarification:respond"
    - "release:request"

  SCRUTINY_OFFICER:
    - "case:read_assigned"
    - "case:transition_scrutiny"
    - "clarification:request"
    - "observation:record"
    - "document:read_case"

  CLEARANCE_OFFICER:
    - "clearance:read_queue"
    - "clearance:claim"
    - "clearance:update"
    - "clearance:complete"
    - "document:read_case"

  COMPETENT_AUTHORITY:
    - "release:read_queue"
    - "release:read_case"
    - "release:decide"
    - "document:read_case"
    - "clearance:read_all"

  SYSTEM_ADMIN:
    - "*"

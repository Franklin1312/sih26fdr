# SIH26265 Configuration Rules
# ==============================
# Public baseline: AICTE Approval Process Handbook 2024–25 to 2026–27, Clause 6.46
# UNCONFIRMED internal routing/deadlines are CONFIGURABLE - NOT hardcoded
# Do not represent assumptions as official policy

# -----------------------------------------------------------------------------
# RELEASE CHECKLISTS (Clause 6.46 conditional)
# -----------------------------------------------------------------------------
release_checklists:
  maturity_fdr_rpgf:
    request_type: "maturity"
    deposit_method: "fdr_rpgf"
    review_path: "fdr_rpgf"
    deadline_days: 15
    mandatory:
      - key: "fdr_matured_confirmed"
        label: "FDR Maturity Confirmed"
        description: "Bank certificate confirming FDR maturity date and amount"
        document_type: "bank_certificate"
      - key: "request_letter"
        label: "Request Letter"
        description: "Formal request on institution letterhead signed by authorized signatory"
        document_type: "request_letter"
      - key: "affidavit_6"
        label: "Affidavit (Form 6)"
        description: "Notarized affidavit as per AICTE Format 6"
        document_type: "affidavit"
      - key: "fdr_original"
        label: "Original FDR Document"
        description: "Original FDR certificate or bank-issued duplicate"
        document_type: "fdr_original"
      - key: "payment_evidence"
        label: "Payment Evidence"
        description: "Proof of original deposit payment (RTGS/NEFT challan, bank statement)"
        document_type: "payment_proof"
      - key: "latest_loa_eoa"
        label: "Latest LoA/EoA"
        description: "Letter of Approval / Extension of Approval from AICTE (current academic year)"
        document_type: "loa_eoa"
      - key: "pgrc_clearance"
        label: "PGRC Clearance"
        description: "Project Grant Review Committee clearance certificate"
        document_type: "clearance_certificate"
      - key: "vigilance_clearance"
        label: "Vigilance Clearance"
        description: "Vigilance department clearance certificate"
        document_type: "clearance_certificate"
    conditional:
      - key: "government_noc"
        label: "Government NOC"
        description: "No Objection Certificate from State Government (if applicable)"
        document_type: "noc"
        condition: "institution_type in [government, government_aided]"
      - key: "bank_noc"
        label: "Bank NOC"
        description: "No Objection Certificate from issuing bank (if applicable)"
        document_type: "noc"
        condition: "bank_requires_noc == true"

  maturity_rtgs:
    request_type: "maturity"
    deposit_method: "rtgs"
    review_path: "rtgs"
    deadline_days: 10
    mandatory:
      - key: "rtgs_funds_received_confirmed"
        label: "RTGS Funds Received Confirmed"
        description: "Bank confirmation of RTGS credit with UTR number"
        document_type: "bank_confirmation"
      - key: "request_letter"
        label: "Request Letter"
        description: "Formal request on institution letterhead"
        document_type: "request_letter"
      - key: "affidavit_6"
        label: "Affidavit (Form 6)"
        description: "Notarized affidavit as per AICTE Format 6"
        document_type: "affidavit"
      - key: "payment_evidence"
        label: "Payment Evidence"
        description: "Original RTGS payment proof with UTR"
        document_type: "payment_proof"
      - key: "latest_loa_eoa"
        label: "Latest LoA/EoA"
        description: "Current AICTE Letter of Approval / Extension of Approval"
        document_type: "loa_eoa"
      - key: "pgrc_clearance"
        label: "PGRC Clearance"
        description: "Project Grant Review Committee clearance"
        document_type: "clearance_certificate"
      - key: "vigilance_clearance"
        label: "Vigilance Clearance"
        description: "Vigilance department clearance"
        document_type: "clearance_certificate"
    conditional:
      - key: "government_noc"
        label: "Government NOC"
        description: "State Government NOC (if applicable)"
        document_type: "noc"
        condition: "institution_type in [government, government_aided]"
      - key: "bank_noc"
        label: "Bank NOC"
        description: "Issuing bank NOC (if applicable)"
        document_type: "noc"
        condition: "bank_requires_noc == true"

  refund_security_deposit:
    request_type: "refund"
    deposit_method: "security_deposit_refund"
    review_path: "sd_refund"
    deadline_days: 10
    mandatory:
      - key: "term_completed_verified"
        label: "Term Completed Verified"
        description: "Verification that AICTE security deposit term has expired"
        document_type: "verification_certificate"
      - key: "no_dues_certificate"
        label: "No Dues Certificate"
        description: "Certificate from AICTE/affiliating body confirming no outstanding dues"
        document_type: "no_dues_certificate"
      - key: "request_letter"
        label: "Request Letter"
        description: "Refund request on institution letterhead"
        document_type: "request_letter"
      - key: "affidavit_6"
        label: "Affidavit (Form 6)"
        description: "Notarized affidavit as per AICTE Format 6"
        document_type: "affidavit"
      - key: "latest_loa_eoa"
        label: "Latest LoA/EoA"
        description: "Current AICTE Letter of Approval / Extension of Approval"
        document_type: "loa_eoa"
      - key: "pgrc_clearance"
        label: "PGRC Clearance"
        description: "Project Grant Review Committee clearance"
        document_type: "clearance_certificate"
    conditional:
      - key: "government_noc"
        label: "Government NOC"
        description: "State Government NOC (if applicable)"
        document_type: "noc"
        condition: "institution_type in [government, government_aided]"

  replacement_fdr_rpgf:
    request_type: "replacement"
    deposit_method: "fdr_rpgf"
    review_path: "fdr_rpgf"
    deadline_days: 15
    mandatory:
      - key: "request_letter"
        label: "Request Letter"
        description: "Replacement request on institution letterhead"
        document_type: "request_letter"
      - key: "affidavit_6"
        label: "Affidavit (Form 6)"
        description: "Notarized affidavit for replacement"
        document_type: "affidavit"
      - key: "new_fdr_original"
        label: "New FDR Original"
        description: "New FDR certificate replacing the original"
        document_type: "fdr_original"
      - key: "previous_instrument_link"
        label: "Previous Instrument Reference"
        description: "Link to previous FDR case/record"
        document_type: "reference"
      - key: "latest_loa_eoa"
        label: "Latest LoA/EoA"
        document_type: "loa_eoa"
      - key: "pgrc_clearance"
        label: "PGRC Clearance"
        document_type: "clearance_certificate"
      - key: "vigilance_clearance"
        label: "Vigilance Clearance"
        document_type: "clearance_certificate"
    conditional:
      - key: "government_noc"
        label: "Government NOC"
        document_type: "noc"
        condition: "institution_type in [government, government_aided]"

# -----------------------------------------------------------------------------
# CLEARANCE TASKS
# -----------------------------------------------------------------------------
clearance_tasks:
  - type: "financial"
    label: "Financial Clearance (PGRC)"
    description: "Project Grant Review Committee financial clearance"
    mandatory: true
    assigned_role: "CLEARANCE_OFFICER"
    evidence_required: true

  - type: "legal"
    label: "Legal Clearance (Vigilance)"
    description: "Vigilance department legal clearance"
    mandatory: true
    assigned_role: "CLEARANCE_OFFICER"
    evidence_required: true

  - type: "technical"
    label: "Technical Clearance (Cell/Bureau)"
    description: "Relevant AICTE Cell/Bureau technical clearance"
    mandatory: true
    assigned_role: "CLEARANCE_OFFICER"
    evidence_required: true

# -----------------------------------------------------------------------------
# DATE TYPES (tracked separately)
# -----------------------------------------------------------------------------
date_types:
  - key: "fdr_maturity"
    label: "FDR Maturity Date"
    description: "Date when FDR matures per bank certificate"
    source: "bank_certificate"
    triggers_alert: true
    advance_days: [30, 15, 7, 1]

  - key: "security_deposit_term"
    label: "Security Deposit Term End"
    description: "AICTE-mandated security deposit term expiry"
    source: "aicte_approval_letter"
    triggers_alert: true
    advance_days: [60, 30, 15, 7, 1]

  - key: "administrative_deadline"
    label: "Administrative Deadline"
    description: "Internal processing deadline (configurable per review path)"
    source: "internal_policy"
    triggers_alert: true
    advance_days: [7, 3, 1]

  - key: "renewal_due"
    label: "Renewal Due Date"
    description: "Date when FDR renewal should be initiated"
    source: "calculated_from_maturity"
    triggers_alert: true
    advance_days: [90, 60, 30]

  - key: "replacement_due"
    label: "Replacement Due Date"
    description: "Date when instrument replacement should be initiated"
    source: "calculated_from_term"
    triggers_alert: true
    advance_days: [60, 30, 15]

# -----------------------------------------------------------------------------
# ALERTS & NOTIFICATIONS
# -----------------------------------------------------------------------------
alerts:
  advance_days: [30, 15, 7, 1]
  dedupe_window_hours: 24
  channels:
    - "in_app"
    - "email_simulated"
  templates:
    upcoming: "Upcoming {date_type}: {days} days remaining"
    overdue: "OVERDUE: {date_type} was due {days} days ago"
    clearance_assigned: "New clearance task assigned: {clearance_type}"
    clarification_received: "Clarification requested for case {case_number}"

# -----------------------------------------------------------------------------
# REVIEW PATH ROUTING
# -----------------------------------------------------------------------------
review_paths:
  fdr_rpgf:
    label: "FDR/RPGF → Approval Bureau NOC"
    authority: "COMPETENT_AUTHORITY"
    description: "FDR/RPGF maturity follows Approval Bureau NOC path after all clearances"

  rtgs:
    label: "RTGS → Council Sanction Order"
    authority: "COMPETENT_AUTHORITY"
    description: "RTGS maturity follows Council sanction-order path after all clearances"

  sd_refund:
    label: "Security Deposit Refund → Separate Review"
    authority: "COMPETENT_AUTHORITY"
    description: "Security deposit refund follows separate review path"

# -----------------------------------------------------------------------------
# VALIDATION RULES (document-level)
# -----------------------------------------------------------------------------
validation_rules:
  file:
    max_size_mb: 10
    allowed_mime_types:
      - "application/pdf"
      - "image/jpeg"
      - "image/png"
      - "image/tiff"
    watermark_demo: true

  document_requirements:
    FDR:
      - "fdr_original"
      - "payment_evidence"
      - "loa_eoa"
    RTGS:
      - "rtgs_receipt"
      - "payment_evidence"
      - "loa_eoa"
    SECURITY_DEPOSIT:
      - "term_completion_certificate"
      - "no_dues_certificate"
      - "loa_eoa"


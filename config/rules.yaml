release_checklists:
  maturity_fdr_rpgf:
    request_type: maturity
    deposit_method: fdr_rpgf
    review_path: fdr_rpgf
    deadline_days: 15
    mandatory:
    - key: fdr_matured_confirmed
      label: FDR Maturity Confirmed
      description: Bank certificate confirming FDR maturity date and amount
      document_type: bank_certificate
    - key: request_letter
      label: Request Letter
      description: Formal request on institution letterhead signed by authorized signatory
      document_type: request_letter
    - key: affidavit_6
      label: Affidavit (Form 6)
      description: Notarized affidavit as per AICTE Format 6
      document_type: affidavit
    - key: fdr_original
      label: Original FDR Document
      description: Original FDR certificate or bank-issued duplicate
      document_type: fdr_original
    - key: payment_evidence
      label: Payment Evidence
      description: Proof of original deposit payment (RTGS/NEFT challan, bank statement)
      document_type: payment_proof
    - key: latest_loa_eoa
      label: Latest LoA/EoA
      description: Letter of Approval / Extension of Approval from AICTE (current
        academic year)
      document_type: loa_eoa
    - key: pgrc_clearance
      label: PGRC Clearance
      description: Public Grievance Redressal Cell clearance certificate
      document_type: clearance_certificate
    - key: vigilance_clearance
      label: Vigilance Clearance
      description: Vigilance Cell clearance certificate
      document_type: clearance_certificate
    conditional:
    - key: government_noc
      label: Government NOC
      description: No Objection Certificate from State Government (if applicable)
      document_type: noc
      condition: institution_type in ['government', 'government_aided']
    - key: bank_noc
      label: Bank NOC
      description: No Objection Certificate from issuing bank (if applicable)
      document_type: noc
      condition: bank_requires_noc == true
    - key: external_body_noc
      label: External Government Body / Bank NOC
      description: Required hold evidence where financial embezzlement involving a government body or bank is recorded.
      document_type: external_body_noc
      condition: external_financial_embezzlement == true
    - key: no_pending_proceedings_certificate
      label: No Pending Complaints or Disciplinary Proceedings
      description: Required for converted private universities and institutions deemed to be universities.
      document_type: no_pending_proceedings_certificate
      condition: converted_or_deemed_university == true
    - key: progressive_closure_no_students_certificate
      label: Progressive Closure No-Students Certificate
      description: Certificate from the affiliating University/Board; not required after the deposit has matured.
      document_type: no_students_certificate
      condition: progressive_closure == true and deposit_matured != true
    - key: merger_child_no_students_certificate
      label: Merger Child-Institution No-Students Certificate
      description: Certificate that no students are studying in the child institution.
      document_type: no_students_certificate
      condition: merger_child_institution == true
  maturity_rtgs:
    request_type: maturity
    deposit_method: rtgs
    review_path: rtgs
    deadline_days: 10
    mandatory:
    - key: rtgs_funds_received_confirmed
      label: RTGS Funds Received Confirmed
      description: Bank confirmation of RTGS credit with UTR number
      document_type: bank_confirmation
    - key: request_letter
      label: Request Letter
      description: Formal request on institution letterhead
      document_type: request_letter
    - key: affidavit_6
      label: Affidavit (Form 6)
      description: Notarized affidavit as per AICTE Format 6
      document_type: affidavit
    - key: payment_evidence
      label: Payment Evidence
      description: Original RTGS payment proof with UTR
      document_type: payment_proof
    - key: latest_loa_eoa
      label: Latest LoA/EoA
      description: Current AICTE Letter of Approval / Extension of Approval
      document_type: loa_eoa
    - key: pgrc_clearance
      label: PGRC Clearance
      description: Public Grievance Redressal Cell clearance
      document_type: clearance_certificate
    - key: vigilance_clearance
      label: Vigilance Clearance
      description: Vigilance Cell clearance
      document_type: clearance_certificate
    conditional:
    - key: government_noc
      label: Government NOC
      description: State Government NOC (if applicable)
      document_type: noc
      condition: institution_type in ['government', 'government_aided']
    - key: bank_noc
      label: Bank NOC
      description: Issuing bank NOC (if applicable)
      document_type: noc
      condition: bank_requires_noc == true
    - key: external_body_noc
      label: External Government Body / Bank NOC
      description: Required hold evidence where financial embezzlement involving a government body or bank is recorded.
      document_type: external_body_noc
      condition: external_financial_embezzlement == true
    - key: no_pending_proceedings_certificate
      label: No Pending Complaints or Disciplinary Proceedings
      document_type: no_pending_proceedings_certificate
      condition: converted_or_deemed_university == true
    - key: progressive_closure_no_students_certificate
      label: Progressive Closure No-Students Certificate
      document_type: no_students_certificate
      condition: progressive_closure == true and deposit_matured != true
    - key: merger_child_no_students_certificate
      label: Merger Child-Institution No-Students Certificate
      document_type: no_students_certificate
      condition: merger_child_institution == true
  replacement_fdr_rpgf:
    request_type: replacement
    deposit_method: fdr_rpgf
    review_path: fdr_rpgf
    deadline_days: 15
    mandatory:
    - key: request_letter
      label: Request Letter
      description: Replacement request on institution letterhead
      document_type: request_letter
    - key: affidavit_6
      label: Affidavit (Form 6)
      description: Notarized affidavit for replacement
      document_type: affidavit
    - key: new_fdr_original
      label: New FDR Original
      description: New FDR certificate replacing the original
      document_type: fdr_original
    - key: previous_instrument_link
      label: Previous Instrument Reference
      description: Link to previous FDR case/record
      document_type: reference
    - key: latest_loa_eoa
      label: Latest LoA/EoA
      document_type: loa_eoa
    - key: pgrc_clearance
      label: PGRC Clearance
      document_type: clearance_certificate
    - key: vigilance_clearance
      label: Vigilance Clearance
      document_type: clearance_certificate
    conditional:
    - key: government_noc
      label: Government NOC
      document_type: noc
      condition: institution_type in ['government', 'government_aided']
  refund_security_deposit_refund:
    request_type: refund
    deposit_method: security_deposit_refund
    review_path: sd_refund
    deadline_days: 10
    mandatory:
    - key: term_completed_verified
      label: Term Completed Verified
      description: Verification that AICTE security deposit term has expired
      document_type: verification_certificate
    - key: no_dues_certificate
      label: No Dues Certificate
      description: Certificate from AICTE/affiliating body confirming no outstanding
        dues
      document_type: no_dues_certificate
    - key: request_letter
      label: Request Letter
      description: Refund request on institution letterhead
      document_type: request_letter
    - key: affidavit_6
      label: Affidavit (Form 6)
      description: Notarized affidavit as per AICTE Format 6
      document_type: affidavit
    - key: latest_loa_eoa
      label: Latest LoA/EoA
      description: Current AICTE Letter of Approval / Extension of Approval
      document_type: loa_eoa
    - key: pgrc_clearance
      label: PGRC Clearance
      description: Public Grievance Redressal Cell clearance
      document_type: clearance_certificate
    conditional:
    - key: government_noc
      label: Government NOC
      description: State Government NOC (if applicable)
      document_type: noc
      condition: institution_type in ['government', 'government_aided']
clearance_tasks:
- type: pgrc
  label: Public Grievance Redressal Cell (PGRC) Clearance
  description: Clearance from the Public Grievance Redressal Cell
  mandatory: true
  assigned_role: CLEARANCE_OFFICER
  evidence_required: true
- type: vigilance
  label: Vigilance Cell Clearance
  description: Clearance from the Vigilance Cell
  mandatory: true
  assigned_role: CLEARANCE_OFFICER
  evidence_required: true
- type: technical
  label: Technical Clearance (Cell/Bureau)
  description: Relevant AICTE Cell/Bureau technical clearance
  mandatory: true
  assigned_role: CLEARANCE_OFFICER
  evidence_required: true
date_types:
- key: fdr_maturity
  label: FDR Maturity Date
  description: Date when FDR matures per bank certificate
  source: bank_certificate
  triggers_alert: true
  advance_days:
  - 30
  - 15
  - 7
  - 1
- key: security_deposit_term
  label: Security Deposit Term End
  description: AICTE-mandated security deposit term expiry
  source: aicte_approval_letter
  triggers_alert: true
  advance_days:
  - 60
  - 30
  - 15
  - 7
  - 1
- key: administrative_deadline
  label: Administrative Deadline
  description: Internal processing deadline (configurable per review path)
  source: internal_policy
  triggers_alert: true
  advance_days:
  - 7
  - 3
  - 1
- key: renewal_due
  label: Renewal Due Date
  description: Date when FDR renewal should be initiated
  source: calculated_from_maturity
  triggers_alert: true
  advance_days:
  - 90
  - 60
  - 30
- key: replacement_due
  label: Replacement Due Date
  description: Date when instrument replacement should be initiated
  source: calculated_from_term
  triggers_alert: true
  advance_days:
  - 60
  - 30
  - 15
alerts:
  advance_days:
  - 30
  - 15
  - 7
  - 1
  dedupe_window_hours: 24
  channels:
  - in_app
  - email_simulated
  templates:
    maturity_approaching:
      subject: "Maturity alert: {case_number}"
      body: "{date_type} is due in {days} day(s) on {date}. Institution: {institution}."
      urgency: medium
    term_ending:
      subject: "Term-end alert: {case_number}"
      body: "{date_type} is due in {days} day(s) on {date}. Institution: {institution}."
      urgency: medium
    overdue_clearance:
      subject: "Deadline alert: {case_number}"
      body: "{date_type} is due in {days} day(s) on {date}. Review the case workflow."
      urgency: high
    upcoming:
      subject: "Upcoming lifecycle event: {case_number}"
      body: "Upcoming {date_type}: {days} days remaining"
      urgency: medium
    overdue:
      subject: "Overdue lifecycle event: {case_number}"
      body: "OVERDUE: {date_type} was due {days} days ago"
      urgency: high
review_paths:
  fdr_rpgf:
    label: "FDR/RPGF \xE2\u2020\u2019 Approval Bureau NOC"
    authority: APPROVAL_BUREAU
    output_document: approval_bureau_noc
    description: Approval Bureau issues an NOC after authorization and all prerequisite clearances.
  rtgs:
    label: "RTGS \xE2\u2020\u2019 Council Sanction Order"
    authority: COUNCIL
    output_document: council_sanction_order
    description: Council issues a sanction order after authorization and all prerequisite clearances.
  sd_refund:
    label: "Security Deposit Refund \xE2\u2020\u2019 Separate Review"
    authority: COMPETENT_AUTHORITY
    description: Security deposit refund follows separate review path
validation_rules:
  file:
    max_size_mb: 10
    allowed_mime_types:
    - application/pdf
    - image/jpeg
    - image/png
    - image/tiff
    watermark_demo: true
  document_requirements:
    FDR:
    - fdr_original
    - payment_proof
    - loa_eoa
    RTGS:
    - rtgs_receipt
    - payment_proof
    - loa_eoa
    SECURITY_DEPOSIT:
    - term_completion_certificate
    - no_dues_certificate
    - loa_eoa
    RPGF:
    - fdr_original
    - payment_proof
    - loa_eoa
  conditional_document_requirements:
  - condition: "institution_type in ['government', 'government_aided']"
    documents:
    - government_noc
